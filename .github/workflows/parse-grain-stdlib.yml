name: Parse Grain stdlib

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      preview:
        description: "Parse against Grain main (preview) instead of the latest release tag"
        type: boolean
        default: false
      grain_ref:
        description: "Grain git ref (tag, branch, or SHA). When set, overrides preview/release."
        type: string
        default: ""

jobs:
  parse-grain-stdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tree-sitter-grain
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: ""

      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Resolve Grain ref
        id: grain
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_GRAIN_REF: ${{ github.event.inputs.grain_ref }}
          INPUT_PREVIEW: ${{ github.event.inputs.preview }}
        run: node scripts/resolve-ref.mjs

      - name: Clone Grain compiler repository
        uses: actions/checkout@v6
        with:
          repository: grain-lang/grain
          path: grain
          ref: ${{ steps.grain.outputs.grain_ref }}

      - name: Install npm dependencies
        run: npm ci

      - name: Parse Grain stdlib (tree-sitter)
        run: npm run test:validate
