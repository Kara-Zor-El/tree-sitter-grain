name: Parse Grain stdlib
# description: Essentially, we want to make sure that the grammar here stays up to date with the stdlib.
# Whilst there can be changes to how language works that may not immediately be flagged as an error, adding new
# keywords or modifying the way syntax works should result in a syntactic error.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      preview:
        description: "Parse against Grain main (preview) instead of the latest release tag"
        type: boolean
        default: false
      grain_ref:
        description: "Grain git ref (tag, branch, or SHA). When set, overrides preview/release."
        type: string
        default: ""

jobs:
  parse-grain-stdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tree-sitter-grain
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Install npm dependencies
        run: nix develop -c npm ci

      - name: Parse Grain stdlib
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_GRAIN_REF: ${{ github.event.inputs.grain_ref }}
          INPUT_PREVIEW: ${{ github.event.inputs.preview }}
        run: nix develop -c npm run test:validate
